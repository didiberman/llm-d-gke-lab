# Public endpoints for the router (OpenAI API) and Open WebUI.
#
# GKE: type LoadBalancer = an external passthrough Network Load Balancer (L4,
#      regional, one forwarding rule each, ~$0.025/hr). No annotation needed.
#      loadBalancerSourceRanges become VPC firewall rules on the nodes; the
#      ranges come from the root app, never from git.
# kind: NodePorts mapped to localhost by local/kind-argocd.yaml.
{{- $gke := eq .Values.environment "gke" }}
{{- if and $gke (not .Values.allowedCidrs) }}
{{- fail "allowedCidrs is empty — refusing to put unauthenticated endpoints on the internet" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.release }}-public
  namespace: {{ .Values.namespace }}
spec:
  type: {{ if $gke }}LoadBalancer{{ else }}NodePort{{ end }}
  selector:
    # The router chart's pods (verified by rendering it).
    llm-d-router-gateway: {{ .Values.release }}-epp
  ports:
    - name: http
      port: 80
      targetPort: 8081   # the Envoy sidecar's listener
      protocol: TCP
      {{- if not $gke }}
      nodePort: 30080
      {{- end }}
  {{- if $gke }}
  loadBalancerSourceRanges: {{ toJson .Values.allowedCidrs }}
  {{- end }}
{{- if .Values.webui.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui-public
  namespace: {{ .Values.namespace }}
spec:
  type: {{ if $gke }}LoadBalancer{{ else }}NodePort{{ end }}
  selector:
    app.kubernetes.io/instance: open-webui
    app.kubernetes.io/component: open-webui
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
      {{- if not $gke }}
      nodePort: 30081
      {{- end }}
  {{- if $gke }}
  loadBalancerSourceRanges: {{ toJson .Values.allowedCidrs }}
  {{- end }}
{{- end }}
