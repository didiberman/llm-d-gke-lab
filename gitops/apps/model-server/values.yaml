# Defaults for the model-server chart. A tier file in gitops/tiers/ overrides
# the workload; the root app injects the environment block (cluster facts and
# secrets-adjacent values that must not live in a public repo).

# --- injected by the root app -------------------------------------------------
environment: gke          # gke | kind
project: llm-d-gke-lab
allowedCidrs: []          # who may reach the public endpoints (GKE only)
webui:
  enabled: true

# --- set by the tier file -----------------------------------------------------
tier: sim
release: llm-d            # router Helm release name; EPP service is <release>-epp
namespace: llm-d

model: Qwen/Qwen3.5-4B
image: ghcr.io/llm-d/llm-d-inference-sim:v1.0.0
gpu:
  enabled: false
  count: 1

# vLLM args (gpu.enabled). The simulator only takes --model/--port.
args: []

resources:
  cpuRequest: 500m
  memoryRequest: 1Gi
  memoryLimit: 2Gi

shmSize: 4Gi
# 10s per attempt. Must cover image pull + weights download + load.
startupProbeFailureThreshold: 60

# GKE capacity for this tier, rendered as a ComputeClass (templates/
# computeclass.yaml). `priorities` is passed through verbatim: GKE tries each
# entry in order and, with whenUnsatisfiable DoNotScaleUp, waits rather than
# fall back to anything not listed (e.g. on-demand GPUs at 2.6x the price).
# Field reference: https://cloud.google.com/kubernetes-engine/docs/reference/crds/computeclass
capacity:
  priorities:
    - machineType: e2-standard-2
      spot: true
      storage:
        bootDiskType: pd-balanced
        bootDiskSize: 40
  whenUnsatisfiable: DoNotScaleUp
  # How long a node must be unneeded before GKE removes it — Karpenter's
  # consolidateAfter. Minimum 1.
  consolidationDelayMinutes: 2

autoscaling:
  minReplicas: 1
  maxReplicas: 4
  queueDepthTarget: 1
  runningRequestsTarget: 16
  stabilizationSeconds: 300

prometheusAddress: http://llmd-kube-prometheus-stack-prometheus.llm-d-monitoring.svc.cluster.local:9090
