# sim — llm-d-inference-sim, no GPU. Speaks the vLLM OpenAI API and emits real
# vLLM metrics, so the router, EPP, KEDA and node auto-provisioning behave as
# they would with a real model. One Spot e2-standard-2 (~$0.04/hr) on GKE,
# free on kind. Needs no GPU quota: the tier to prove the cluster with.
tier: sim
model: Qwen/Qwen3.5-4B
image: ghcr.io/llm-d/llm-d-inference-sim:v1.0.0
gpu:
  enabled: false
resources:
  cpuRequest: 500m
  memoryRequest: 1Gi
  memoryLimit: 2Gi
capacity:
  priorities:
    - machineType: e2-standard-2
      spot: true
      storage:
        bootDiskType: pd-balanced
        bootDiskSize: 40
    # Same price class, other hardware: if e2 Spot is out in every zone.
    - machineType: n2d-standard-2
      spot: true
      storage:
        bootDiskType: pd-balanced
        bootDiskSize: 40
  whenUnsatisfiable: DoNotScaleUp
  consolidationDelayMinutes: 2
autoscaling:
  minReplicas: 1
  maxReplicas: 4
