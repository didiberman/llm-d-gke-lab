# kimi — moonshotai/Kimi-Dev-72B, the largest Kimi that fits two 96 GB GPUs.
#
# 72.7B coding model (Qwen2.5-72B base, MIT, ungated), BF16 only: 145 GB on
# disk, ~135 GiB in VRAM. Tensor-parallel across the two RTX PRO 6000s of a
# g4-standard-96 (96 vCPU, 360 GB RAM), leaving ~34 GiB of KV cache (~110k
# tokens). The same GPU pair was measured on AWS (g7e.12xlarge) by llm-d-eks-lab.
#
# ONE replica, Spot: ~$3.44/hr (on-demand would be $9.00). Takes both GPUs of a
# 2-GPU quota and 96 vCPU. Cold start ~15-25 min: 145 GB through a Hyperdisk
# Balanced boot disk, whose baseline throughput a ComputeClass cannot raise.
tier: kimi
model: moonshotai/Kimi-Dev-72B
image: docker.io/vllm/vllm-openai:v0.30.0
gpu:
  enabled: true
  count: 2
args:
  - --port
  - "8000"
  - --tensor-parallel-size
  - "2"
  # Supports 131072, but every token of context is KV cache taken from
  # concurrent requests. 32k is plenty for a coding lab.
  - --max-model-len
  - "32768"
  - --gpu-memory-utilization
  - "0.92"
  # Open WebUI and agent tools send tool_choice "auto"; vLLM rejects it with a
  # 400 unless tool calling is on. Qwen2.5 fine-tunes emit Hermes tool calls.
  - --enable-auto-tool-choice
  - --tool-call-parser
  - hermes
  - --disable-access-log-for-endpoints
  - /health,/metrics,/v1/models
  - --shutdown-timeout
  - "45"
# 96 vCPU / 360 GB node with nothing else on it; the high memory limit is page
# cache while 145 GB of safetensors stream to the GPUs.
resources:
  cpuRequest: "16"
  memoryRequest: 64Gi
  memoryLimit: 256Gi
# Tensor-parallel workers talk over shared memory.
shmSize: 16Gi
# 145 GB to download and load: 240 x 10s = 40 minutes.
startupProbeFailureThreshold: 240
capacity:
  priorities:
    - machineType: g4-standard-96
      spot: true
      gpu:
        type: nvidia-rtx-pro-6000
        count: 2
        driverVersion: latest
      storage:
        bootDiskType: hyperdisk-balanced
        bootDiskSize: 400
  whenUnsatisfiable: DoNotScaleUp
  consolidationDelayMinutes: 2
autoscaling:
  minReplicas: 1
  maxReplicas: 1
