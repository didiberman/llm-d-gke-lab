# small — a real GPU, a small model. g2-standard-4 = 1x L4 (24 GB), 4 vCPU,
# 16 GB RAM. Qwen3.5-4B is 8.7 GB of weights, ~12 GB left for KV cache.
# Spot ~$0.42/hr per replica, 1->2 replicas if the project's L4 quota is 2
# (NVIDIA_L4 family in the region, and GPUS-ALL-REGIONS). L4 is offered in
# us-central1-a/b/c; GKE only places it in the cluster's zones that have it.
tier: small
model: Qwen/Qwen3.5-4B
image: docker.io/vllm/vllm-openai:v0.30.0
gpu:
  enabled: true
  count: 1
args:
  - --port
  - "8000"
  - --max-model-len
  - "16384"
  - --gpu-memory-utilization
  - "0.90"
  - --limit-mm-per-prompt
  - image=0,video=0
  - --disable-access-log-for-endpoints
  - /health,/metrics,/v1/models
  - --shutdown-timeout
  - "45"
resources:
  cpuRequest: "2"
  memoryRequest: 8Gi
  memoryLimit: 12Gi
capacity:
  priorities:
    - machineType: g2-standard-4
      spot: true
      gpu:
        type: nvidia-l4
        count: 1
        driverVersion: latest
      storage:
        # G2 boots from Persistent Disk; ~10 GB image + 9 GB weights + room.
        bootDiskType: pd-balanced
        bootDiskSize: 100
  whenUnsatisfiable: DoNotScaleUp
  consolidationDelayMinutes: 2
autoscaling:
  minReplicas: 1
  maxReplicas: 2
