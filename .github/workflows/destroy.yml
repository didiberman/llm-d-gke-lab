# Destroy — tear down ALL billable infrastructure, on demand.
#
# Actions → destroy → Run workflow, type "destroy" to confirm.
#
# Order matters:
#   1. Argo CD apps  delete the root Application. Its finalizer cascades through
#                    every child app: the ComputeClasses go (GKE drains the GPU
#                    nodes) and the LoadBalancer Services go (GKE deletes their
#                    forwarding rules and firewall rules, asynchronously).
#   2. wait          for those forwarding rules to actually disappear. A
#                    leftover k8s load balancer keeps firewall rules in the VPC
#                    and makes the network destroy in step 3 fail.
#   3. 10-cluster    Argo CD, GKE (with every auto-provisioned node pool), the
#                    subnet and the VPC.
#   4. sweep         leaked k8s-* load balancer pieces, then fail loudly if
#                    anything still bills.
#
# Left in place on purpose (~$0): 00-bootstrap — the project, the GCS state
# bucket (prevent_destroy) and the Workload Identity setup this workflow uses.
#
# deploy/config.yaml is NOT changed. Set `cluster: false` too, or the next push
# under terraform/10-cluster/ recreates the cluster.
name: destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to tear down the cluster and everything on it'
        required: true
        type: string

permissions:
  id-token: write # OIDC
  contents: read

# Same group as deploy: never race an apply for the state lock.
concurrency:
  group: gcp-llm-d-gke-lab
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: us-central1
  ZONE: us-central1-b
  CLUSTER: llm-d-gke-lab
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_VERSION: "1.13.4"

jobs:
  destroy:
    if: inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Same inputs the deploy workflow passes, so the destroy plan evaluates
      # the configuration exactly as it was applied.
      - name: Terraform inputs
        env:
          ALLOWED_CIDRS: ${{ secrets.ALLOWED_CIDRS }}
        run: |
          set -euo pipefail
          [ -n "$PROJECT_ID" ] || { echo "::error::Repo variable GCP_PROJECT_ID is not set"; exit 1; }
          {
            echo "TF_VAR_project_id=$PROJECT_ID"
            echo "TF_VAR_region=$REGION"
            echo "TF_VAR_zone=$ZONE"
            echo "TF_VAR_name=$CLUSTER"
            [ -n "$ALLOWED_CIDRS" ] && echo "TF_VAR_allowed_cidrs=$ALLOWED_CIDRS"
            true
          } >> "$GITHUB_ENV"

      - name: Cluster present?
        id: cluster
        run: |
          if gcloud container clusters describe "$CLUSTER" --zone "$ZONE" --project "$PROJECT_ID" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No GKE cluster found — skipping the Argo CD teardown; 10-cluster is still destroyed if its state holds anything (e.g. a VPC left by a failed run)."
          fi

      - uses: google-github-actions/get-gke-credentials@v3
        if: steps.cluster.outputs.exists == 'true'
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.ZONE }}
          project_id: ${{ env.PROJECT_ID }}

      # Deleting the root app (foreground) cascades through every child app
      # and what they deployed, thanks to the resources finalizers. Terraform
      # would otherwise uninstall Argo CD first and orphan the load balancers.
      - name: Delete the Argo CD apps (cascades to ComputeClasses, load balancers, workloads)
        if: steps.cluster.outputs.exists == 'true'
        run: |
          set -uo pipefail
          if kubectl -n argocd get application root >/dev/null 2>&1; then
            kubectl -n argocd delete application root --cascade=foreground --wait=true --timeout=15m \
              || echo "::warning::Root app deletion did not finish in 15 minutes — falling back to direct deletes."
          fi
          # Backstop, in case Argo CD itself is broken.
          kubectl -n argocd delete applications.argoproj.io --all --wait=false 2>/dev/null || true
          kubectl delete computeclasses.cloud.google.com -l "app.kubernetes.io/part-of=${CLUSTER}" --wait=false 2>/dev/null || true
          kubectl -n llm-d delete service --field-selector spec.type=LoadBalancer --wait=false 2>/dev/null || true

      # GKE tags what it creates for a LoadBalancer Service with the service
      # name in the forwarding rule's description.
      - name: Wait for Kubernetes-created load balancers to go
        if: steps.cluster.outputs.exists == 'true'
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            lbs=$(gcloud compute forwarding-rules list --project "$PROJECT_ID" \
              --filter="description~kubernetes.io/service-name" --format='value(name)' | grep -c . || true)
            echo "k8s load balancers=$lbs"
            [ "$lbs" = "0" ] && exit 0
            sleep 15
          done
          echo "::warning::Load balancers still present after 10 minutes — continuing; the sweep step will remove them."

      # Not gated on the cluster existing: a previous run can die after the
      # cluster is gone but before the VPC is, and that VPC must still go.
      - name: Destroy 10-cluster
        working-directory: terraform/10-cluster
        run: |
          set -uo pipefail
          terraform init -no-color -backend-config="bucket=${PROJECT_ID}-tfstate"
          if [ -z "$(terraform state list 2>/dev/null)" ]; then
            echo "10-cluster state is empty — nothing to destroy."
            exit 0
          fi
          terraform destroy -no-color -auto-approve && exit 0

          # Most likely load balancer firewall rules or forwarding rules GKE
          # left behind when the cluster went first. Sweep and retry once.
          echo "::warning::10-cluster destroy failed — sweeping k8s load balancer leftovers and retrying once."
          ../../scripts/sweep-k8s-lb.sh "$PROJECT_ID" "$REGION" "$CLUSTER"
          terraform destroy -no-color -auto-approve

      - name: Sweep k8s load balancer leftovers
        if: always()
        run: ./scripts/sweep-k8s-lb.sh "$PROJECT_ID" "$REGION" "$CLUSTER"

      - name: Verify nothing is still billing
        if: always()
        run: |
          set -u
          count() { grep -c . || true; }
          clusters=$(gcloud container clusters list --project "$PROJECT_ID" --format='value(name)' | count)
          vms=$(gcloud compute instances list --project "$PROJECT_ID" --format='value(name)' | count)
          disks=$(gcloud compute disks list --project "$PROJECT_ID" --format='value(name)' | count)
          lbs=$(gcloud compute forwarding-rules list --project "$PROJECT_ID" --format='value(name)' | count)
          ips=$(gcloud compute addresses list --project "$PROJECT_ID" --format='value(name)' | count)
          nets=$(gcloud compute networks list --project "$PROJECT_ID" --filter="name=${CLUSTER}" --format='value(name)' | count)
          {
            echo "### Destroy report"
            echo "| Resource | Remaining |"
            echo "|---|---|"
            echo "| GKE clusters | $clusters |"
            echo "| VMs | $vms |"
            echo "| Disks | $disks |"
            echo "| Forwarding rules (load balancers) | $lbs |"
            echo "| Reserved IP addresses | $ips |"
            echo "| Lab VPC | $nets |"
            echo ""
            echo "Left on purpose: the project, the GCS state bucket and Workload Identity (00-bootstrap, ~\$0)."
            echo "deploy/config.yaml is unchanged — set \`cluster: false\` or the next push under terraform/10-cluster/ recreates it."
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          total=$((clusters + vms + disks + lbs + ips + nets))
          if [ "$total" -ne 0 ]; then
            echo "::error title=Infrastructure still present::$total billable resource(s) remain — see the report."
            exit 1
          fi
          echo "All clear: nothing left billing."

  refused:
    if: inputs.confirm != 'destroy'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Confirmation must be exactly \"destroy\" — nothing was touched."
          exit 1
