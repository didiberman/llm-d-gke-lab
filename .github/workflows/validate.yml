# Static checks only — no GCP credentials, no cost, runs on every push and PR.
#
# Deliberately does NOT run `terraform plan`: that needs real credentials and a
# real state bucket, and this repo is a public lab. The checks here are the ones
# that catch the mistakes that actually happen: drifted formatting, renamed
# module variables, invalid YAML, and chart or CRD versions that have been
# yanked upstream.
name: validate

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.4"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff terraform/

      - name: terraform validate (all layers)
        run: |
          fail=0
          for d in terraform/*/; do
            [ -f "$d/versions.tf" ] || continue
            echo "::group::$d"
            # -backend=false so no credentials or state bucket are needed.
            if ! (cd "$d" && terraform init -backend=false -input=false >/dev/null && terraform validate); then
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

  gitops:
    # Renders every Argo CD chart for every tier in both environments (GKE and
    # kind), checks the guardrails refuse bad input, and validates the output
    # against Kubernetes + ComputeClass/KEDA/Argo CD schemas. No cluster needed.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: helm lint
        run: |
          helm lint gitops/root -f deploy/config.yaml
          helm lint gitops/apps/model-server -f gitops/tiers/sim.yaml --set environment=kind
          helm lint gitops/apps/model-server -f gitops/tiers/gpu.yaml --set-json 'allowedCidrs=["203.0.113.7/32"]'

      - name: Render + schema-validate every tier
        run: ./scripts/render-check.sh

      - name: Plain YAML parses
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          files = sorted(glob.glob("local/*.yaml") + glob.glob("gitops/values/*.yaml")
                         + glob.glob("gitops/tiers/*.yaml")) + ["deploy/config.yaml", "gitops/bootstrap/argocd-values.yaml"]
          bad = 0
          for f in files:
              try:
                  list(yaml.safe_load_all(open(f)))
                  print(f"  OK   {f}")
              except Exception as e:
                  print(f"  FAIL {f}: {e}")
                  bad = 1
          sys.exit(bad)
          PY

      - name: Shell scripts parse
        run: |
          for f in scripts/*.sh local/*.sh; do
            [ -e "$f" ] || continue
            bash -n "$f" && echo "  OK   $f"
          done

  upstream-pins:
    # The versions this project pins live in other people's release pages.
    # Charts get yanked and CRD assets get renamed; this catches it on a
    # schedule instead of ten minutes into an apply.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Pinned charts and CRDs still resolve
        run: |
          set -u
          fail=0
          # Only a definitive 404/410 means
          # the asset was removed. Network trouble or throttling warns.
          check_url() {
            local code
            code=$(curl -sIL -o /dev/null -w '%{http_code}' --max-time 30 --retry 2 "$1" || echo "000")
            case "$code" in
              200) echo "  OK   $1" ;;
              404|410) echo "  FAIL ($code) $1 — asset removed upstream"; fail=1 ;;
              *) echo "::warning title=Could not verify asset::$1 returned $code"
                 echo "  SKIP ($code) $1" ;;
            esac
          }

          GW=$(grep -A3 'variable "gateway_api_version"' terraform/10-cluster/variables.tf | grep default | grep -oE 'v[0-9.]+')
          GAIE=$(grep -A3 'variable "gaie_version"' terraform/10-cluster/variables.tf | grep default | grep -oE 'v[0-9.]+')
          check_url "https://github.com/kubernetes-sigs/gateway-api/releases/download/${GW}/standard-install.yaml"
          check_url "https://github.com/kubernetes-sigs/gateway-api-inference-extension/releases/download/${GAIE}/v1-manifests.yaml"

          helm repo add kedacore https://kedacore.github.io/charts >/dev/null
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts >/dev/null
          helm repo update >/dev/null

          check_chart() {
            if helm show chart "$1" --version "$2" >/dev/null 2>&1; then echo "  OK   $1 $2"; else echo "  FAIL $1 $2"; fail=1; fi
          }

          KEDA=$(grep -A3 'variable "keda_version"' terraform/10-cluster/variables.tf | grep default | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          PROM=$(grep -A3 'variable "prometheus_chart_version"' terraform/10-cluster/variables.tf | grep default | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          ARGOCD=$(grep -A3 'variable "argocd_chart_version"' terraform/10-cluster/variables.tf | grep default | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          ARGOAPPS=$(grep -A3 'variable "argocd_apps_chart_version"' terraform/10-cluster/variables.tf | grep default | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          # Charts Argo CD deploys are pinned in the root app's values.
          ROUTER=$(awk '/^  router:/{print $2}' gitops/root/values.yaml)
          WEBUI=$(awk '/^  openWebui:/{print $2}' gitops/root/values.yaml)

          helm repo add argo https://argoproj.github.io/argo-helm >/dev/null
          helm repo add open-webui https://helm.openwebui.com/ >/dev/null
          helm repo update >/dev/null

          check_chart kedacore/keda "$KEDA"
          check_chart prometheus-community/kube-prometheus-stack "$PROM"
          check_chart argo/argo-cd "$ARGOCD"
          check_chart argo/argocd-apps "$ARGOAPPS"
          check_chart oci://ghcr.io/llm-d/charts/llm-d-router-standalone "$ROUTER"
          check_chart open-webui/open-webui "$WEBUI"

          exit $fail
