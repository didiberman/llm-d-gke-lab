# kind cluster for the free GitOps proof (`make argocd-local`).
#
# Mirrors the GKE node layout: one worker labelled as a system node (Argo CD,
# KEDA, Prometheus, Open WebUI land here, as on the GKE system pool) and two
# labelled as model-server capacity, standing in for the nodes a ComputeClass
# would make GKE provision. That provisioning itself cannot run here.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: llm-d-argocd

nodes:
  - role: control-plane
    extraPortMappings:
      # NodePorts from the model-server chart's kind mode.
      - containerPort: 30080   # router (OpenAI API)
        hostPort: 18080
        protocol: TCP
      - containerPort: 30081   # Open WebUI
        hostPort: 18081
        protocol: TCP
  - role: worker
    labels:
      llm-d-gke-lab/role: system
  - role: worker
    labels:
      llm-d-gke-lab/role: model-server
      llm-d-gke-lab/tier: sim
  - role: worker
    labels:
      llm-d-gke-lab/role: model-server
      llm-d-gke-lab/tier: sim
